CONFIG_RT_MAIN_THREAD_STACK_SIZE=32768
CONFIG_RT_MAIN_THREAD_PRIORITY=15
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_ISR_LOG=y
# CONFIG_ULOG_USING_COLOR is not set
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
CONFIG_RT_TIMER_THREAD_STACK_SIZE=1024
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_GBARECOMP_COMPACT_FRAMEBUFFER=y
CONFIG_GBARECOMP_NO_HOST_SAMPLER=y
CONFIG_GBARECOMP_SMALL_TRACE_RING=y
CONFIG_GBARECOMP_NO_HANG_TRACE_DUMP=y
CONFIG_GBARECOMP_PSRAM_ALLOC=y
CONFIG_GBARECOMP_SMALL_AUDIO_CAPTURE=y
# TF card: the cartridge image lives on the card and is read into PSRAM at boot.
CONFIG_BSP_USING_SPI1=y
CONFIG_BSP_SPI1_TX_USING_DMA=y
CONFIG_BSP_SPI1_RX_USING_DMA=y
CONFIG_RT_USING_SPI_MSD=y
CONFIG_RT_USING_DFS_ELMFAT=y
